<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上传图片并生成</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3efe6;
      --ink: #1d1a16;
      --muted: #6f675e;
      --line: #ddd4c4;
      --panel: #fffdf8;
      --accent: #0e6b52;
      --accent-ink: #f7fffb;
      --danger: #8f2d2d;
      --shadow: 0 16px 40px rgba(48, 36, 18, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(14, 107, 82, 0.08), transparent 32%),
        var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }
    main {
      width: min(1080px, calc(100% - 32px));
      margin: 32px auto 48px;
    }
    header { margin-bottom: 24px; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: "Iowan Old Style", Palatino, "Songti SC", serif;
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .lede { margin: 8px 0 0; color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .modes { display: flex; gap: 8px; margin-bottom: 16px; }
    .modes button, .primary {
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
    }
    .modes button {
      background: transparent;
      color: var(--ink);
      padding: 8px 14px;
    }
    .modes button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--panel);
    }
    label { display: block; font-size: 14px; font-weight: 600; }
    .drop {
      display: grid;
      place-items: center;
      min-height: 168px;
      margin: 8px 0 12px;
      border: 1.5px dashed #b7ad9d;
      border-radius: 16px;
      background: #faf7f1;
      color: var(--muted);
      text-align: center;
      cursor: pointer;
    }
    .drop.hot { border-color: var(--accent); background: #eef8f4; }
    .drop strong { color: var(--ink); font-size: 16px; }
    .drop small { display: block; margin-top: 6px; }
    .previews { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; padding: 0; list-style: none; }
    .previews li { position: relative; width: 84px; height: 84px; }
    .previews img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .previews button {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: rgba(29, 26, 22, 0.78);
      color: white;
      cursor: pointer;
    }
    textarea, select {
      width: 100%;
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      color: inherit;
      font: inherit;
      padding: 12px;
    }
    textarea { min-height: 120px; resize: vertical; }
    .field { margin-bottom: 14px; }
    .primary {
      width: 100%;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 12px 16px;
    }
    .primary:disabled { opacity: 0.6; cursor: progress; }
    .hint, #status { color: var(--muted); font-size: 13px; }
    #error:empty, #status:empty { display: none; }
    #error {
      margin: 12px 0 0;
      color: var(--danger);
      font-size: 14px;
    }
    .stage {
      min-height: 520px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 12px;
      overflow: hidden;
    }
    .stage img { width: 100%; height: auto; border-radius: 12px; }
    .stage.is-working, .stage.is-result { justify-items: stretch; align-content: start; }
    .stage.is-result { overflow: auto; max-height: calc(100vh - 160px); }
    .shot {
      width: 100%;
      margin: 0;
      display: grid;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .shot img { width: 100%; cursor: zoom-in; }
    .shot-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .download-all { justify-self: end; }
    .download, .preview {
      padding: 8px 14px;
      border-radius: 999px;
      border: 0;
      background: var(--ink);
      color: var(--panel);
      text-decoration: none;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .preview { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    dialog {
      width: min(960px, calc(100% - 32px));
      border: 0;
      border-radius: 18px;
      padding: 16px;
      background: var(--panel);
    }
    dialog::backdrop { background: rgba(29, 26, 22, 0.72); }
    dialog img { width: 100%; max-height: 72vh; object-fit: contain; background: #f6f1e8; }
    dialog menu { display: flex; justify-content: flex-end; gap: 8px; margin: 12px 0 0; padding: 0; }
    .empty { color: var(--muted); text-align: center; }
    .progress { width: min(100%, 420px); margin: 0 auto; }
    .orb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(14, 107, 82, 0.4);
      animation: pulse 1.4s ease-out infinite;
    }
    .progress.failed .orb { background: var(--danger); animation: none; }
    @keyframes pulse {
      70% { box-shadow: 0 0 0 14px rgba(14, 107, 82, 0); }
      100% { box-shadow: 0 0 0 0 rgba(14, 107, 82, 0); }
    }
    .progress-title {
      margin: 14px 0 0;
      font-family: "Iowan Old Style", Palatino, "Songti SC", serif;
      font-size: 28px;
    }
    .progress-time { margin: 6px 0 18px; color: var(--muted); }
    .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .steps li { position: relative; padding-left: 22px; color: var(--muted); }
    .steps li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.45em;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ddd4c4;
    }
    .steps li.done { color: var(--ink); }
    .steps li.done::before { background: var(--accent); }
    .steps li.current { color: var(--ink); font-weight: 650; }
    .steps li.current::before { background: var(--accent); box-shadow: 0 0 0 4px rgba(14, 107, 82, 0.16); }
    .progress-note { color: var(--muted); font-size: 13px; }
    .history { margin-top: 28px; }
    .history h2 {
      margin: 0 0 12px;
      font-family: "Iowan Old Style", Palatino, "Songti SC", serif;
      font-size: 22px;
      font-weight: 600;
    }
    .history-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .history-item {
      width: 100%;
      display: grid;
      gap: 8px;
      padding: 12px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .history-meta { color: var(--muted); font-size: 13px; }
    .history-prompt { font-weight: 600; }
    .history-thumbs { display: flex; gap: 8px; }
    .history-thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
    @media (max-width: 800px) {
      h1 { font-size: 32px; }
      .layout { grid-template-columns: 1fr; }
      .stage { min-height: 280px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">magic·art</p>
      <h1>上传参考图，生成一张新图</h1>
      <p class="lede">图生图会把图片和修改说明一起提交。密钥只留在本机服务里。</p>
      <p id="status" role="status"></p>
      <p id="error" role="alert"></p>
    </header>
    <div class="layout">
      <form id="form" class="panel">
        <div class="modes">
          <button type="button" id="mode-edit" aria-pressed="true">图生图</button>
          <button type="button" id="mode-text" aria-pressed="false">文生图</button>
        </div>
        <div id="upload-block">
          <label for="file">参考图</label>
          <label class="drop" id="drop">
            <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
            <span><strong>拖入图片，或点击选择</strong><small>PNG、JPEG、WebP、GIF，最多 16 张</small></span>
          </label>
          <ul id="previews" class="previews"></ul>
        </div>
        <div class="field">
          <label for="model">模型</label>
          <select id="model" name="model"></select>
        </div>
        <div class="field">
          <label for="prompt">描述</label>
          <textarea id="prompt" name="prompt" required placeholder="保留人物面部和服装，把背景换成清晨的海边"></textarea>
        </div>
        <div class="field">
          <label for="count">每张原图张数</label>
          <select id="count" name="count">
            <option value="1">1 张</option>
            <option value="2">2 张</option>
            <option value="3">3 张</option>
            <option value="4">4 张</option>
            <option value="5">5 张</option>
          </select>
        </div>
        <div class="field">
          <label for="size">尺寸</label>
          <select id="size" name="size">
            <option value="original">与原图一致</option>
            <option value="1024x1024">方形 1024×1024</option>
            <option value="896x1152">竖版 896×1152</option>
            <option value="1152x896">横版 1152×896</option>
            <option value="864x1536">竖屏 864×1536</option>
            <option value="1536x864">横屏 1536×864</option>
          </select>
        </div>
        <button class="primary" id="submit" type="submit">生成</button>
        <p class="hint">上传多张参考图时，每张都会单独图生图，并且同时进行。张数是每张原图要生成的数量。每张图都可以单独预览和下载。</p>
      </form>
      <section class="panel stage" id="stage" aria-live="polite">
        <p class="empty">生成的图片会显示在这里</p>
      </section>
    </div>
    <section class="history" id="history">
      <h2>历史记录</h2>
      <p class="empty" id="history-empty">还没有生成记录</p>
      <ol id="history-list" class="history-list"></ol>
    </section>
    <dialog id="lightbox">
      <img id="lightbox-image" alt="图片预览">
      <menu>
        <button type="button" class="preview" id="lightbox-prev">上一张</button>
        <button type="button" class="preview" id="lightbox-next">下一张</button>
        <a class="download" id="lightbox-download">下载这张</a>
        <button type="button" class="preview" id="lightbox-close">关闭</button>
      </menu>
    </dialog>
  </main>
  <script>
    const form = document.querySelector("#form");
    const fileInput = document.querySelector("#file");
    const drop = document.querySelector("#drop");
    const previews = document.querySelector("#previews");
    const uploadBlock = document.querySelector("#upload-block");
    const prompt = document.querySelector("#prompt");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const stage = document.querySelector("#stage");
    const submit = document.querySelector("#submit");
    const lightbox = document.querySelector("#lightbox");
    const lightboxImage = document.querySelector("#lightbox-image");
    const lightboxDownload = document.querySelector("#lightbox-download");
    const lightboxPrev = document.querySelector("#lightbox-prev");
    const lightboxNext = document.querySelector("#lightbox-next");
    let gallery = [];
    let galleryIndex = 0;
    const selected = [];
    let mode = "edit";
    let previewUrls = [];
    let progressTimer = 0;

    const stepSets = {
      edit: [
        ["accepted", "已接收请求"],
        ["upload", "上传参考图"],
        ["generating", "模型绘制"],
        ["saving", "保存图片"]
      ],
      text: [
        ["accepted", "已接收请求"],
        ["generating", "模型绘制"],
        ["saving", "保存图片"]
      ]
    };

    function setMode(next) {
      mode = next;
      document.querySelector("#mode-edit").setAttribute("aria-pressed", String(next === "edit"));
      document.querySelector("#mode-text").setAttribute("aria-pressed", String(next === "text"));
      uploadBlock.hidden = next !== "edit";
      document.querySelector('label[for="count"]').textContent = next === "edit" ? "每张原图张数" : "张数";
      const originalSize = document.querySelector('#size option[value="original"]');
      originalSize.hidden = next !== "edit";
      originalSize.disabled = next !== "edit";
      if (next !== "edit" && document.querySelector("#size").value === "original") {
        document.querySelector("#size").value = "1024x1024";
      }
      prompt.placeholder = next === "edit"
        ? "保留人物面部和服装，把背景换成清晨的海边"
        : "一只橘猫坐在窗边看雨，柔和自然光，水彩插画";
    }

    function renderPreviews() {
      previewUrls.forEach((url) => URL.revokeObjectURL(url));
      previewUrls = selected.map((file) => URL.createObjectURL(file));
      previews.innerHTML = "";
      previewUrls.forEach((url, index) => {
        const item = document.createElement("li");
        const image = document.createElement("img");
        image.src = url;
        image.alt = selected[index].name;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "移除 " + selected[index].name);
        remove.addEventListener("click", () => {
          selected.splice(index, 1);
          renderPreviews();
        });
        item.append(image, remove);
        previews.append(item);
      });
    }

    function addFiles(files) {
      for (const file of files) {
        if (selected.length >= 16) break;
        const name = file.name.toLowerCase();
        const allowed = file.type.startsWith("image/") || /\.(png|jpe?g|webp|gif)$/.test(name);
        if (allowed) selected.push(file);
      }
      renderPreviews();
    }

    fileInput.addEventListener("change", () => {
      addFiles(fileInput.files);
      fileInput.value = "";
    });
    ["dragenter", "dragover"].forEach((name) => {
      drop.addEventListener(name, (event) => {
        event.preventDefault();
        drop.classList.add("hot");
      });
    });
    ["dragleave", "drop"].forEach((name) => {
      drop.addEventListener(name, (event) => {
        event.preventDefault();
        drop.classList.remove("hot");
      });
    });
    drop.addEventListener("drop", (event) => addFiles(event.dataTransfer.files));
    document.querySelector("#mode-edit").addEventListener("click", () => setMode("edit"));
    document.querySelector("#mode-text").addEventListener("click", () => setMode("text"));

    const modelSelect = document.querySelector("#model");

    function fillModels(models, selected) {
      modelSelect.innerHTML = "";
      const choices = models.length ? models : [{ id: selected, name: selected }];
      choices.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.name && item.name !== item.id ? item.name + "（" + item.id + "）" : item.id;
        option.selected = item.id === selected;
        modelSelect.append(option);
      });
      if (selected && ![...modelSelect.options].some((option) => option.value === selected)) {
        const option = document.createElement("option");
        option.value = selected;
        option.textContent = selected;
        option.selected = true;
        modelSelect.prepend(option);
      }
    }

    modelSelect.addEventListener("change", () => {
      status.textContent = "当前模型 " + modelSelect.value;
    });

    loadHistory();

    fetch("/api/config").then((response) => response.json()).then(async (config) => {
      if (!config.ready) {
        error.textContent = config.error || "配置还不能使用";
        return;
      }
      let models = [];
      try {
        const listed = await fetch("/api/models").then((response) => response.json());
        models = listed.models || [];
      } catch (exc) {
        models = [];
      }
      fillModels(models, config.model);
      status.textContent = "当前模型 " + modelSelect.value;
    });

    function stopProgressClock() {
      if (progressTimer) window.clearInterval(progressTimer);
      progressTimer = 0;
    }

    function mountProgress() {
      stopProgressClock();
      stage.classList.add("is-working");
      stage.innerHTML = "";
      const panel = document.createElement("div");
      panel.className = "progress";
      panel.innerHTML = '<div class="orb" aria-hidden="true"></div>'
        + '<p class="progress-title" data-title>正在发送请求</p>'
        + '<p class="progress-time" data-elapsed>已进行 0 秒</p>'
        + '<ol class="steps" data-steps></ol>'
        + '<p class="progress-note">请保持这个页面打开。</p>';
      stage.append(panel);
      renderSteps("accepted");
      const started = Date.now();
      progressTimer = window.setInterval(() => {
        const node = stage.querySelector("[data-elapsed]");
        if (!node) return;
        node.textContent = "已进行 " + Math.round((Date.now() - started) / 1000) + " 秒";
      }, 250);
    }

    function renderSteps(stageName) {
      const list = stage.querySelector("[data-steps]");
      if (!list) return;
      const steps = stepSets[mode];
      const current = Math.max(0, steps.findIndex(([id]) => id === stageName));
      list.innerHTML = "";
      steps.forEach(([id, label], index) => {
        const item = document.createElement("li");
        item.textContent = label;
        if (stageName === "completed" || index < current) item.className = "done";
        else if (index === current) item.className = "current";
        list.append(item);
      });
    }

    function showJob(job) {
      const title = stage.querySelector("[data-title]");
      const panel = stage.querySelector(".progress");
      if (title) title.textContent = job.message || "正在生成";
      if (panel) panel.classList.toggle("failed", job.status === "failed");
      renderSteps(job.stage === "failed" ? "generating" : job.stage);
      const elapsed = stage.querySelector("[data-elapsed]");
      if (elapsed && Number.isFinite(job.elapsed_seconds)) {
        elapsed.textContent = "已进行 " + job.elapsed_seconds + " 秒";
      }
    }

    function resultFilename(url, index, total) {
      const stamp = new Date();
      const pad = (value) => String(value).padStart(2, "0");
      const ext = (url.split("?")[0].match(/\.([a-z0-9]+)$/i) || [null, "png"])[1].toLowerCase();
      const safeExt = ["png", "jpg", "jpeg", "webp", "gif"].includes(ext) ? ext : "png";
      const baseName = "generatepic-"
        + stamp.getFullYear() + pad(stamp.getMonth() + 1) + pad(stamp.getDate())
        + "-" + pad(stamp.getHours()) + pad(stamp.getMinutes()) + pad(stamp.getSeconds());
      return (total > 1 ? baseName + "-" + (index + 1) : baseName) + "." + safeExt;
    }

    function downloadUrl(url, filename) {
      const joiner = url.includes("?") ? "&" : "?";
      return url + joiner + "download=1&filename=" + encodeURIComponent(filename);
    }

    function openPreview(index) {
      galleryIndex = index;
      const item = gallery[index];
      lightboxImage.src = item.preview;
      lightboxImage.alt = "第 " + (index + 1) + " 张预览";
      lightboxDownload.href = item.download;
      lightboxDownload.download = item.filename;
      lightboxPrev.hidden = gallery.length < 2;
      lightboxNext.hidden = gallery.length < 2;
      if (!lightbox.open) lightbox.showModal();
    }

    lightboxPrev.addEventListener("click", () => openPreview((galleryIndex - 1 + gallery.length) % gallery.length));
    lightboxNext.addEventListener("click", () => openPreview((galleryIndex + 1) % gallery.length));
    document.querySelector("#lightbox-close").addEventListener("click", () => lightbox.close());

    function placeDownloadAll(job) {
      if (!job.job_id || !job.images || !job.images.length) return;
      let link = stage.querySelector("[data-download-all]");
      if (!link) {
        link = document.createElement("a");
        link.className = "download download-all";
        link.dataset.downloadAll = "1";
        link.textContent = "下载全部";
        stage.prepend(link);
      }
      link.href = "/api/jobs/" + job.job_id + "/archive";
      link.download = "generatepic.zip";
    }

    function showImages(job) {
      stopProgressClock();
      stage.classList.remove("is-working");
      stage.classList.add("is-result");
      stage.innerHTML = "";
      placeDownloadAll(job);
      gallery = job.images.map((item, index) => {
        const filename = resultFilename(item.url, index, job.images.length);
        return { preview: item.url, download: downloadUrl(item.url, filename), filename };
      });
      gallery.forEach((item, index) => {
        const figure = document.createElement("figure");
        figure.className = "shot";
        const image = document.createElement("img");
        image.src = item.preview;
        image.alt = "第 " + (index + 1) + " 张生成结果";
        image.addEventListener("click", () => openPreview(index));
        const actions = document.createElement("div");
        actions.className = "shot-actions";
        const preview = document.createElement("button");
        preview.type = "button";
        preview.className = "preview";
        preview.textContent = "预览";
        preview.addEventListener("click", () => openPreview(index));
        const link = document.createElement("a");
        link.className = "download";
        link.href = item.download;
        link.download = item.filename;
        link.textContent = "下载";
        actions.append(preview, link);
        figure.append(image, actions);
        stage.append(figure);
      });
      status.textContent = job.request_id ? "完成，共 " + gallery.length + " 张。request_id: " + job.request_id : "完成，共 " + gallery.length + " 张";
      loadHistory();
    }

    function loadHistory() {
      fetch("/api/history").then((response) => response.json()).then((payload) => {
        const items = payload.history || [];
        const list = document.querySelector("#history-list");
        const empty = document.querySelector("#history-empty");
        empty.hidden = items.length > 0;
        list.replaceChildren();
        items.forEach((item) => {
          const entry = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "history-item";
          const meta = document.createElement("div");
          meta.className = "history-meta";
          const kind = item.mode === "edit" ? "图生图" : "文生图";
          meta.textContent = item.created + " · " + kind + " · " + item.images.length + " 张";
          const text = document.createElement("div");
          text.className = "history-prompt";
          text.textContent = item.prompt || "未填写描述";
          const thumbs = document.createElement("div");
          thumbs.className = "history-thumbs";
          item.images.slice(0, 4).forEach((image) => {
            const thumb = document.createElement("img");
            thumb.src = image.url;
            thumb.alt = "";
            thumbs.append(thumb);
          });
          button.append(meta, text, thumbs);
          button.addEventListener("click", () => showImages(item));
          entry.append(button);
          list.append(entry);
        });
      }).catch(() => {});
    }

    function showPartial(job) {
      let box = stage.querySelector("[data-partial]");
      if (!box) {
        box = document.createElement("div");
        box.className = "partial";
        box.dataset.partial = "1";
        stage.append(box);
      }
      if (box.childElementCount === job.images.length) return;
      box.replaceChildren();
      gallery = job.images.map((item, index) => {
        const filename = resultFilename(item.url, index, job.images.length);
        return { preview: item.url, download: downloadUrl(item.url, filename), filename };
      });
      gallery.forEach((item, index) => {
        const figure = document.createElement("figure");
        figure.className = "shot";
        const image = document.createElement("img");
        image.src = item.preview;
        image.alt = "第 " + (index + 1) + " 张生成结果";
        image.addEventListener("click", () => openPreview(index));
        const actions = document.createElement("div");
        actions.className = "shot-actions";
        const preview = document.createElement("button");
        preview.type = "button";
        preview.className = "preview";
        preview.textContent = "预览";
        preview.addEventListener("click", () => openPreview(index));
        const link = document.createElement("a");
        link.className = "download";
        link.href = item.download;
        link.download = item.filename;
        link.textContent = "下载";
        actions.append(preview, link);
        figure.append(image, actions);
        box.append(figure);
      });
      placeDownloadAll(job);
      status.textContent = "已完成 " + job.images.length + " 张，其余还在生成";
    }

    function sendGenerate(body) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/generate");
        xhr.responseType = "json";
        xhr.upload.onprogress = (event) => {
          if (!event.lengthComputable) return;
          const title = stage.querySelector("[data-title]");
          if (title) title.textContent = "正在上传参考图 " + Math.round(event.loaded / event.total * 100) + "%";
          renderSteps("upload");
        };
        xhr.onload = () => resolve(xhr);
        xhr.onerror = () => reject(new Error("网络中断，请再试一次"));
        xhr.send(body);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      if (mode === "edit" && selected.length === 0) {
        error.textContent = "请先上传至少一张参考图";
        return;
      }
      const body = new FormData();
      body.append("mode", mode);
      body.append("model", modelSelect.value);
      body.append("prompt", prompt.value);
      body.append("count", document.querySelector("#count").value);
      body.append("size", document.querySelector("#size").value);
      selected.forEach((file) => body.append("images", file));
      submit.disabled = true;
      submit.textContent = "生成中…";
      status.textContent = "正在生成";
      mountProgress();
      try {
        const xhr = await sendGenerate(body);
        const payload = xhr.response || {};
        if (xhr.status < 200 || xhr.status >= 300) {
          throw new Error(payload.error || "生成失败");
        }
        showJob(payload);
        while (payload.status === "running") {
          await new Promise((resolve) => window.setTimeout(resolve, 800));
          const response = await fetch("/api/jobs/" + payload.job_id);
          const job = await response.json();
          if (!response.ok) throw new Error(job.error || "查询进度失败");
          showJob(job);
          if (job.images && job.images.length && job.status === "running") showPartial(job);
          if (job.status === "failed") throw new Error(job.error || job.message || "生成失败");
          if (job.status === "completed") {
            showImages(job);
            return;
          }
        }
        if (payload.status === "completed") showImages(payload);
      } catch (exc) {
        stopProgressClock();
        const title = stage.querySelector("[data-title]");
        const panel = stage.querySelector(".progress");
        if (title && panel) {
          panel.classList.add("failed");
          title.textContent = exc.message;
        } else {
          stage.classList.remove("is-working");
          stage.innerHTML = '<p class="empty"></p>';
          stage.querySelector(".empty").textContent = exc.message;
        }
        error.textContent = exc.message;
      } finally {
        submit.disabled = false;
        submit.textContent = "生成";
      }
    });
  </script>
</body>
</html>
