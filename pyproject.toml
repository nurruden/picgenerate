[project]
name = "generatepic"
version = "0.1.0"
description = "shyfai magic·art 文生图与图生图客户端"
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "flask>=3.1", "pillow>=11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
generatepic = "generatepic.cli:main"
generatepic-web = "generatepic.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["generatepic*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
